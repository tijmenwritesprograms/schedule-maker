name: Deploy pull request preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out pull request revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publish Blazor WebAssembly app
        run: dotnet publish ScheduleMaker.App/ScheduleMaker.App.csproj --configuration Release --output ./publish

      - name: Add SPA fallback
        run: cp ./publish/wwwroot/index.html ./publish/wwwroot/404.html

      - name: Add .nojekyll marker
        run: touch ./publish/wwwroot/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./publish/wwwroot

  deploy:
    if: ${{ !github.event.pull_request.draft }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy pull request preview
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          preview: true
